name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Apache Kvrocks version to build (e.g. 2.15.0)'
        type: string
        required: true
      iteration:
        description: 'Package iteration/revision number'
        type: string
        required: true
        default: '1'
      publish_release:
        description: 'Publish release to GitHub Releases'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.arch }}, ${{ matrix.cpu_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Generic x86_64 build (maximum compatibility)
          - os: ubuntu-24.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: generic
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: ""
            pkg_suffix: ""
            fpm_extra_args: "--conflicts kvrocks-avx2 --replaces kvrocks-avx2 --conflicts kvrocks-v3 --replaces kvrocks-v3"

          # Modern CPU optimized x86-64-v3 / AVX2 build (AVX, AVX2, BMI1/2, FMA, PCLMUL)
          - os: ubuntu-24.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: avx2
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: "-march=x86-64-v3 -mpclmul -O3"
            pkg_suffix: "-avx2"
            fpm_extra_args: "--provides kvrocks --conflicts kvrocks --replaces kvrocks --conflicts kvrocks-v3 --replaces kvrocks-v3"

          # ARM64 / aarch64 build
          - os: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64
            cpu_target: generic
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: ""
            pkg_suffix: ""
            fpm_extra_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake libtool python3 \
                                  ruby ruby-dev rubygems rpm libssl-dev ccache
          sudo gem install --no-document fpm

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-

      - name: Resolve Version & Iteration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            ITERATION="${{ inputs.iteration }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref_name }}"
            REF="${REF#v}"
            if [[ "$REF" =~ ^([^-]+)-(.+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              ITERATION="${BASH_REMATCH[2]}"
            else
              VERSION="$REF"
              ITERATION="1"
            fi
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Version must be explicitly provided!"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ITERATION=$ITERATION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION, iteration: $ITERATION"

      - name: Build Kvrocks
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          if [ -n "${{ matrix.extra_flags }}" ]; then
            export CFLAGS="${{ matrix.extra_flags }}"
            export CXXFLAGS="${{ matrix.extra_flags }}"
          fi
          ccache -z

          git clone --depth 1 -b v${{ env.VERSION }} https://github.com/apache/kvrocks.git
          cd kvrocks
          ./x.py build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_flags }} -j $(nproc)
          
          ccache -s

      - name: Prepare Packaging RootFS
        run: |
          mkdir -p rootfs/usr/bin
          mkdir -p rootfs/etc/kvrocks
          mkdir -p rootfs/usr/lib/systemd/system
          mkdir -p rootfs/var/lib/kvrocks
          mkdir -p rootfs/var/log/kvrocks
          mkdir -p rootfs/usr/share/doc/kvrocks

          # Binaries
          cp kvrocks/build/kvrocks rootfs/usr/bin/
          cp kvrocks/build/kvrocks2redis rootfs/usr/bin/

          # Configuration with FHS paths
          cp kvrocks/kvrocks.conf rootfs/etc/kvrocks/kvrocks.conf
          python3 scripts/patch-config.py rootfs/etc/kvrocks/kvrocks.conf

          # Systemd service unit (production-ready with FHS paths)
          cp scripts/kvrocks.service rootfs/usr/lib/systemd/system/

          # License & Notice
          cp -r kvrocks/LICENSE kvrocks/NOTICE kvrocks/licenses rootfs/usr/share/doc/kvrocks/

      - name: Package DEB
        run: |
          fpm -s dir -t deb \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.arch }}" \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --after-install scripts/postinst.sh \
            --after-remove scripts/postrm.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.fpm_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}_${{ env.VERSION }}-${{ env.ITERATION }}_${{ matrix.arch }}.deb"

      - name: Package RPM
        run: |
          fpm -s dir -t rpm \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.rpm_arch }}" \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --after-install scripts/postinst.sh \
            --after-remove scripts/postrm.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.fpm_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}-${{ env.VERSION }}-${{ env.ITERATION }}.${{ matrix.rpm_arch }}.rpm"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.cpu_target }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve Release Tag & Name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            ITERATION="${{ inputs.iteration }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            REF="${{ github.ref_name }}"
            REF="${REF#v}"
            if [[ "$REF" =~ ^([^-]+)-(.+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              ITERATION="${BASH_REMATCH[2]}"
            else
              VERSION="$REF"
              ITERATION="1"
            fi
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Version must be explicitly provided!"
            exit 1
          fi

          echo "RELEASE_TAG=v${VERSION}-${ITERATION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Kvrocks ${VERSION}-${ITERATION}" >> $GITHUB_ENV

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages for APT Repo History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: apt-repo-existing

      - name: Build Debian APT Repository
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64

          # Preserve existing debs if available
          if [ -d apt-repo-existing/pool/main ]; then
            cp -n apt-repo-existing/pool/main/*.deb apt-repo/pool/main/ 2>/dev/null || true
          fi

          # Copy newly built deb packages
          cp dist/*.deb apt-repo/pool/main/

          # Copy installer script to root
          cp scripts/install.sh apt-repo/install.sh

          # Scan packages and generate index files
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz

          dpkg-scanpackages --arch arm64 pool/main > dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz

          # Generate Release metadata
          cd dists/stable
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Apache Kvrocks Packages" \
            -o APT::FTPArchive::Release::Label="Kvrocks" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Apache Kvrocks Debian/Ubuntu APT Repository" \
            release . > Release
          cd ../..

      - name: Deploy APT Repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
