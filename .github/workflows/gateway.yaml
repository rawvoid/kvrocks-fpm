name: Gateway

# Deploys the edge gateway Worker together with the landing page and the installer it serves as static
# assets (gateway/public/). Repository metadata is not built here: the release workflow pushes it to
# gh-pages and the Worker proxies it, so a deploy cannot shift package indexes out from under clients.
concurrency:
  group: cloudflare-gateway-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
  workflow_dispatch:

jobs:
  test:
    name: Quality Gate
    uses: ./.github/workflows/test.yaml

  deploy:
    name: Deploy Worker & Static Assets
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Resolves both placeholders from values this run already has: the repository slug from
      # GITHUB_REPOSITORY (exported by GitHub for every step), the gateway origin from the same
      # repository variable the release pipeline uses. A fork configures variables, never files.
      - name: Render Static Assets
        working-directory: gateway
        env:
          KVROCKS_GATEWAY_URL: ${{ vars.KVROCKS_GATEWAY_URL }}
        run: npm run build

      # `wrangler deploy` uploads the Worker script and every rendered file as one version, so the
      # page, the installer and the routing config always go live together.
      - name: Deploy
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --var "GITHUB_REPO:${{ github.repository }}"
