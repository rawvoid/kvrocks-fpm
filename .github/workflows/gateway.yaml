name: Gateway

# Deploys the edge gateway Worker together with the landing page and the installer it serves as static
# assets (gateway/public/). Repository metadata is not built here: the release workflow pushes it to
# gh-pages and the Worker proxies it, so a deploy cannot shift package indexes out from under clients.
concurrency:
  group: cloudflare-gateway-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
  workflow_dispatch:

jobs:
  test:
    name: Quality Gate
    uses: ./.github/workflows/test.yaml

  deploy:
    name: Deploy Worker & Static Assets
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # `wrangler deploy` uploads the Worker script and every file in gateway/public/ as one version,
      # so the page, the installer and the routing config always go live together.
      - name: Deploy
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
