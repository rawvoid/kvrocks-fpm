name: Gateway

# Deploys the edge gateway Worker together with the landing page and the installer it serves as static
# assets (gateway/public/). Repository metadata is not built here: the release workflow pushes it to
# gh-pages and the Worker proxies it, so a deploy cannot shift package indexes out from under clients.
concurrency:
  group: cloudflare-gateway-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
  workflow_dispatch:

jobs:
  test:
    name: Quality Gate
    uses: ./.github/workflows/test.yaml

  deploy:
    name: Deploy Worker & Static Assets
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Renders both placeholders from values this run already has (GITHUB_REPOSITORY and the
      # KVROCKS_GATEWAY_URL variable) and deploys the Worker with the same value it rendered into the
      # page, so CI and a workstation follow one path. `npm run deploy` passes GITHUB_REPO to wrangler
      # itself, because `wrangler deploy` does not read `.dev.vars`.
      - name: Deploy
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KVROCKS_GATEWAY_URL: ${{ vars.KVROCKS_GATEWAY_URL }}
        run: npm run deploy
