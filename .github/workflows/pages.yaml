name: Pages

concurrency:
  group: pages-repository-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/install.sh'
  workflow_dispatch:

jobs:
  sync-pages:
    name: Validate and Sync to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Validate Install Script
        run: |
          if [ -f main-repo/scripts/install.sh ]; then
            shellcheck main-repo/scripts/install.sh
            bash -n main-repo/scripts/install.sh
          fi

      - name: Checkout GitHub Pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Sync Assets to gh-pages
        run: |
          # 1. Synchronize automated installer script
          if [ -f main-repo/scripts/install.sh ]; then
            cp -p main-repo/scripts/install.sh gh-pages-branch/install.sh
          fi

          cd gh-pages-branch

          # 2. Skip commit if there are no changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "Static assets on gh-pages are already up to date. Nothing to commit."
            exit 0
          fi

          # 3. Commit and push changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pages): sync static assets from main [skip ci]"
          git push origin gh-pages

          echo "Successfully synchronized static assets to gh-pages branch."
