name: Pages

# Shares its group with the release publish job, which pushes to the same gh-pages branch. `queue: max`
# keeps a queued run from being dropped when a newer one enters the group.
concurrency:
  group: pages-repository-deployment
  cancel-in-progress: false
  queue: max

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/install.sh'
      - 'web/**'
  workflow_dispatch:

jobs:
  test:
    name: Quality Gate
    uses: ./.github/workflows/test.yaml

  sync-pages:
    name: Sync Static Assets to gh-pages
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          path: main-repo

      # gh-pages may not exist yet, so this checks the workflow commit out and moves onto the pages
      # branch below instead of asking for a ref that may be absent.
      - name: Checkout GitHub Pages Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: gh-pages-branch

      - name: Move onto the GitHub Pages Branch
        working-directory: gh-pages-branch
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git checkout --quiet -B gh-pages FETCH_HEAD
          else
            git checkout --quiet --orphan gh-pages
            git rm --quiet -rf .
          fi

      - name: Sync Assets to gh-pages
        run: |
          cp -p main-repo/scripts/install.sh gh-pages-branch/install.sh
          cp -p main-repo/web/index.html gh-pages-branch/index.html

          cd gh-pages-branch

          # Skip the commit when the synced assets are unchanged.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Static assets on gh-pages are already up to date. Nothing to commit."
            exit 0
          fi

          # Commit and push the synced assets.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pages): sync static assets from main [skip ci]"
          git push origin gh-pages

          echo "Successfully synchronized static assets to gh-pages branch."
