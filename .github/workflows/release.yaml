name: Release Packages

concurrency:
  group: pages-repository-deployment
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Apache Kvrocks version to build (e.g. 2.15.0)'
        type: string
        required: true
      iteration:
        description: 'Package iteration/revision number'
        type: string
        required: true
        default: '1'
      draft:
        description: 'Create as Draft Release (do not publish to GitHub Pages)'
        type: boolean
        required: true
        default: false
      publish_release:
        description: 'Publish release to GitHub Releases'
        type: boolean
        required: true
        default: true

jobs:
  preflight:
    name: Preflight & Release Guard
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.guard.outputs.release_tag }}
      version: ${{ steps.guard.outputs.version }}
      iteration: ${{ steps.guard.outputs.iteration }}
      channel: ${{ steps.guard.outputs.channel }}
      is_prerelease: ${{ steps.guard.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Inputs & Release Guard
        id: guard
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ITERATION: ${{ inputs.iteration }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          IS_DRAFT: ${{ inputs.draft }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          ITERATION="${INPUT_ITERATION}"

          if [ -z "$VERSION" ]; then
            echo "::error::Version must be explicitly provided!"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must match semantic versioning format (e.g. 2.15.0 or 2.15.0-rc1)!"
            exit 1
          fi

          if ! echo "$ITERATION" | grep -Eq '^[0-9A-Za-z.+~]+$'; then
            echo "::error::Iteration must be a valid package revision token (e.g. 1)!"
            exit 1
          fi

          # Automatically deduce distribution channel and prerelease flag from version semantics
          if echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
            CHANNEL="stable"
            IS_PRERELEASE="false"
          else
            CHANNEL="testing"
            IS_PRERELEASE="true"
          fi

          RELEASE_TAG="v${VERSION}-${ITERATION}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "iteration=${ITERATION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

          # Release Exists Guard: prevent accidental re-releases that poison CDN edge caches
          if [ "$PUBLISH_RELEASE" = "true" ] && [ "$IS_DRAFT" != "true" ]; then
            RELEASE_EXISTS=false
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              RELEASE_EXISTS=true
            elif git ls-remote --tags --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              RELEASE_EXISTS=true
            fi

            if [ "$RELEASE_EXISTS" = "true" ]; then
              echo "::error title=Release Already Exists::Release ${RELEASE_TAG} already exists on GitHub Releases or remote git tags!"
              echo "::error::Re-releasing the same version-iteration causes fatal CDN 'Hash Sum mismatch' errors on client machines."
              echo "::error::Please bump iteration (e.g. iteration=2) instead."
              exit 1
            fi
          fi

          echo "Preflight validation passed: Target Release ${RELEASE_TAG}"

  test:
    name: Pre-Release Quality Gate
    needs: preflight
    uses: ./.github/workflows/test.yaml

  build-and-package:
    name: Build & Package (${{ matrix.arch }}, ${{ matrix.cpu_target }})
    needs: [preflight, test]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ITERATION: ${{ needs.preflight.outputs.iteration }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Modern CPU optimized x86-64-v3 build (AVX, AVX2, BMI1/2, FMA, PCLMUL - Default Performance package)
          - os: ubuntu-22.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: v3
            extra_flags: "-march=x86-64-v3 -mpclmul -O3"
            pkg_suffix: ""
            deb_extra_args: "--conflicts kvrocks-legacy --replaces kvrocks-legacy"
            rpm_extra_args: "--conflicts kvrocks-legacy"

          # Legacy x86-64-v1 build (Baseline compatibility for older CPUs/VMs without AVX2)
          - os: ubuntu-22.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: legacy
            extra_flags: "-O3"
            pkg_suffix: "-legacy"
            deb_extra_args: "--provides kvrocks --conflicts kvrocks --replaces kvrocks"
            rpm_extra_args: "--provides kvrocks --conflicts kvrocks"

          # ARM64 / aarch64 build
          - os: ubuntu-22.04-arm
            arch: arm64
            rpm_arch: aarch64
            cpu_target: generic
            extra_flags: "-O3"
            pkg_suffix: ""
            deb_extra_args: ""
            rpm_extra_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake libtool python3 \
                                  ruby-full ruby-dev rpm libssl-dev ccache binutils
          sudo gem install --no-document fpm

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-

      - name: Build Kvrocks
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="2G"
          export LDFLAGS="-static-libstdc++ -static-libgcc $LDFLAGS"
          # Inject -g to generate comprehensive DWARF debug symbols alongside -O3 optimizations
          export CFLAGS="-g ${{ matrix.extra_flags }}"
          export CXXFLAGS="-g ${{ matrix.extra_flags }}"
          ccache -z

          git clone --depth 1 -b v${{ env.VERSION }} https://github.com/apache/kvrocks.git
          cd kvrocks
          ./x.py build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc -flto=auto" -DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON -j $(nproc)
          
          ccache -s

      - name: Inspect Binary Linkage & Compatibility
        run: |
          echo "=== Dynamic library dependencies (ldd) ==="
          ldd kvrocks/build/kvrocks || true
          
          echo "=== Check libstdc++ linkage ==="
          if ldd kvrocks/build/kvrocks | grep -q "libstdc++"; then
            echo "::warning::libstdc++ is dynamically linked!"
          else
            echo "Verified: libstdc++ is statically linked."
          fi

          echo "=== Glibc symbols required by kvrocks ==="
          objdump -T kvrocks/build/kvrocks | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu > "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" || true
          MAX_GLIBC=$(tail -n 1 "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" 2>/dev/null || echo "unknown")
          echo "Max GLIBC symbol required: ${MAX_GLIBC}"
          cat "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" || true
          echo "### Binary Compatibility (${{ matrix.arch }}-${{ matrix.cpu_target }})" >> $GITHUB_STEP_SUMMARY
          echo "- Highest GLIBC symbol required: \`${MAX_GLIBC}\`" >> $GITHUB_STEP_SUMMARY

      - name: Separate Debug Symbols & Strip Binaries
        run: |
          DEBUGINFO_NAME="kvrocks${{ matrix.pkg_suffix }}-debuginfo_${{ env.VERSION }}-${{ env.ITERATION }}_${{ matrix.arch }}.tar.gz"
          echo "DEBUGINFO_NAME=${DEBUGINFO_NAME}" >> $GITHUB_ENV

          echo "=== Extracting detached debug symbols, stripping, and embedding debuglink ==="
          for bin in kvrocks kvrocks2redis; do
            objcopy --only-keep-debug "kvrocks/build/${bin}" "kvrocks/build/${bin}.debug"
            chmod 0644 "kvrocks/build/${bin}.debug"
            strip --strip-unneeded "kvrocks/build/${bin}"
            objcopy --add-gnu-debuglink="kvrocks/build/${bin}.debug" "kvrocks/build/${bin}"
          done

          echo "=== Quality Gate: Verifying Debug Symbols & Build IDs ==="
          # 1. Verify DWARF debug sections exist
          if ! readelf -S kvrocks/build/kvrocks.debug 2>/dev/null | grep -q '\.debug_info'; then
            echo "::error::kvrocks.debug does not contain .debug_info! DWARF symbol generation failed."
            exit 1
          fi
          echo "Verified: kvrocks.debug contains valid DWARF debug sections."

          # 2. Verify binary and detached debuginfo share the exact same GNU Build ID
          KV_BIN_ID=$(readelf -n kvrocks/build/kvrocks | awk '/Build ID:/{print $3}')
          KV_DBG_ID=$(readelf -n kvrocks/build/kvrocks.debug 2>/dev/null | awk '/Build ID:/{print $3}')
          echo "Kvrocks GNU Build ID: ${KV_BIN_ID}"
          if [ -z "$KV_BIN_ID" ] || [ "$KV_BIN_ID" != "$KV_DBG_ID" ]; then
            echo "::error::Build ID mismatch! Binary (${KV_BIN_ID}) != Debug (${KV_DBG_ID})"
            exit 1
          fi
          echo "Verified: GNU Build IDs match perfectly."

          echo "=== Archiving debug symbols ==="
          tar -czf "${DEBUGINFO_NAME}" -C kvrocks/build kvrocks.debug kvrocks2redis.debug
          ls -lh "${DEBUGINFO_NAME}" kvrocks/build/kvrocks kvrocks/build/kvrocks2redis

          echo "### Binary Stripping & Detached Debuginfo (${{ matrix.arch }}-${{ matrix.cpu_target }})" >> $GITHUB_STEP_SUMMARY
          echo "- GNU Build ID: \`${KV_BIN_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Stripped binary size: \`$(du -h kvrocks/build/kvrocks | cut -f1)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Detached debug archive: \`${DEBUGINFO_NAME}\` (\`$(du -h ${DEBUGINFO_NAME} | cut -f1)\`)" >> $GITHUB_STEP_SUMMARY

      - name: Prepare Packaging RootFS
        run: |
          mkdir -p rootfs/usr/bin
          mkdir -p rootfs/etc/kvrocks
          mkdir -p rootfs/usr/share/doc/kvrocks
          mkdir -p rootfs/usr/lib/systemd/system

          # Binaries
          cp kvrocks/build/kvrocks rootfs/usr/bin/
          cp kvrocks/build/kvrocks2redis rootfs/usr/bin/

          # Configuration with FHS paths and native log retention
          cp kvrocks/kvrocks.conf rootfs/etc/kvrocks/kvrocks.conf
          python3 packaging/patch-config.py rootfs/etc/kvrocks/kvrocks.conf

          # License, Notice & Pristine Upstream Configuration References
          cp -r kvrocks/LICENSE kvrocks/NOTICE kvrocks/licenses rootfs/usr/share/doc/kvrocks/
          cp kvrocks/kvrocks.conf rootfs/usr/share/doc/kvrocks/kvrocks.conf.default
          if [ -f kvrocks/utils/kvrocks2redis/kvrocks2redis.conf ]; then
            cp kvrocks/utils/kvrocks2redis/kvrocks2redis.conf rootfs/usr/share/doc/kvrocks/kvrocks2redis.conf.default
          elif [ -f kvrocks/kvrocks2redis.conf ]; then
            cp kvrocks/kvrocks2redis.conf rootfs/usr/share/doc/kvrocks/kvrocks2redis.conf.default
          fi

          # Systemd service unit (unified standard path /usr/lib/systemd/system)
          cp packaging/systemd/kvrocks.service rootfs/usr/lib/systemd/system/

          # Display colored unified diff in a collapsible group
          echo "::group::View Configuration Diff (Upstream vs Patched)"
          diff -u --color=always rootfs/usr/share/doc/kvrocks/kvrocks.conf.default rootfs/etc/kvrocks/kvrocks.conf || true
          echo "::endgroup::"

      - name: Validate Patched Configuration (Dry-Run)
        run: |
          mkdir -p /tmp/kvrocks-dryrun/data /tmp/kvrocks-dryrun/log
          kvrocks/build/kvrocks -c rootfs/etc/kvrocks/kvrocks.conf \
            --bind 127.0.0.1 \
            --port 56789 \
            --dir /tmp/kvrocks-dryrun/data \
            --log-dir /tmp/kvrocks-dryrun/log \
            --daemonize no &
          KV_PID=$!
          sleep 1
          if kill -0 $KV_PID 2>/dev/null; then
            echo "Kvrocks configuration successfully validated against built binary."
            kill -TERM $KV_PID
            wait $KV_PID 2>/dev/null || true
            rm -rf /tmp/kvrocks-dryrun
          else
            wait $KV_PID
            EXIT_CODE=$?
            echo "::error::Kvrocks failed to parse patched configuration! Exit code: $EXIT_CODE"
            rm -rf /tmp/kvrocks-dryrun
            exit 1
          fi

      - name: Package DEB
        run: |
          fpm -s dir -t deb \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.arch }}" \
            -d "libssl3" \
            --category "database" \
            --vendor "Rawvoid" \
            --maintainer "Rawvoid <rawvoid@users.noreply.github.com>" \
            --deb-user root \
            --deb-group root \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --before-remove packaging/hooks/prerm.sh \
            --after-install packaging/hooks/postinst.sh \
            --after-remove packaging/hooks/postrm.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.deb_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}_${{ env.VERSION }}-${{ env.ITERATION }}_${{ matrix.arch }}.deb"

      - name: Package RPM
        run: |
          fpm -s dir -t rpm \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.rpm_arch }}" \
            -d "libssl.so.3()(64bit)" \
            --rpm-digest sha256 \
            --category "database" \
            --vendor "Rawvoid" \
            --maintainer "Rawvoid <rawvoid@users.noreply.github.com>" \
            --rpm-user root \
            --rpm-group root \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --before-remove packaging/hooks/prerm.sh \
            --after-install packaging/hooks/postinst.sh \
            --after-remove packaging/hooks/postrm.sh \
            --rpm-posttrans packaging/hooks/rpm-posttrans.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.rpm_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}-${{ env.VERSION }}-${{ env.ITERATION }}.${{ matrix.rpm_arch }}.rpm"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.cpu_target }}
          path: |
            *.deb
            *.rpm
            *.tar.gz
            glibc-symbols-*.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Repositories
    needs: [preflight, build-and-package]
    if: inputs.publish_release == true || inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_NAME: Kvrocks ${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.iteration }}
      VERSION: ${{ needs.preflight.outputs.version }}
      ITERATION: ${{ needs.preflight.outputs.iteration }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Setup GPG & Sign RPM Packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set! Repository and package signing cannot proceed."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y rpm gnupg

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 3600\nmax-cache-ttl 7200\n' > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye 2>/dev/null || true

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | tail -n 1)
          echo "Loaded GPG signing key: $GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV

          # Prime gpg-agent in-memory cache via stdin pipeline (avoids writing passphrase to disk)
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -u "$GPG_KEY_ID" -sbo /dev/null /dev/null
          fi

          trap 'rm -f /tmp/kvrocks-signing-key.asc' EXIT

          # Configure RPM macros for package signing (gpg-agent daemon handles passphrase in-memory)
          printf '%%_signature gpg\n%%_gpg_name %s\n%%_gpg_path %s/.gnupg\n%%_gpg_digest_algo sha256\n%%__gpg /usr/bin/gpg\n' "$GPG_KEY_ID" "$HOME" > ~/.rpmmacros
          printf '%%__gpg_sign_cmd %%{__gpg} --batch --no-verbose --no-armor --pinentry-mode loopback %%{?_gpg_digest_algo:--digest-algo %%{_gpg_digest_algo}} --no-secmem-warning -u "%%{_gpg_name}" -sbo %%{__signature_filename} %%{__plaintext_filename}\n' >> ~/.rpmmacros

          echo "Signing RPM packages in dist/..."
          ls dist/*.rpm >/dev/null 2>&1 || { echo "::error::No RPM packages found in dist/!"; exit 1; }
          rpmsign --addsign dist/*.rpm

          # Export public key to a regular file (avoids sudo closing process substitution /dev/fd/N)
          gpg --armor --export "$GPG_KEY_ID" > /tmp/kvrocks-signing-key.asc
          sudo rpm --import /tmp/kvrocks-signing-key.asc

          echo "Verifying RPM package signatures..."
          for rpm_pkg in dist/*.rpm; do
            if ! verify_out=$(sudo rpm -K --define '_pkgverify_level all' "$rpm_pkg" 2>&1) || ! echo "$verify_out" | grep -q 'signatures OK'; then
              echo "::error::RPM package $rpm_pkg signature verification failed: $verify_out"
              exit 1
            fi
            echo "$verify_out"
          done

      - name: Generate Checksums & Consolidate Glibc Symbols
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cat glibc-symbols-*.txt 2>/dev/null | sort -Vu > glibc-symbols.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ inputs.draft == true || inputs.draft == 'true' }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Draft Release Status
        if: inputs.draft == true || inputs.draft == 'true'
        run: |
          echo "### Draft Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Draft release \`${{ env.RELEASE_TAG }}\` created on GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "- **Note**: Deployment to GitHub Pages skipped. Draft releases are not published to online APT/RPM repositories." >> $GITHUB_STEP_SUMMARY

      - name: Build Debian APT & RPM Repositories (Incremental Merge)
        if: inputs.draft != true && inputs.draft != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KVROCKS_GATEWAY_URL: ${{ vars.KVROCKS_GATEWAY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm xz-utils

          # 1. Safely retrieve existing gh-pages deployment to preserve historical metadata
          # Check if gh-pages branch genuinely exists on remote before cloning.
          # If it exists on remote, git clone MUST succeed. If clone fails, abort immediately to protect historical records!
          REMOTE_REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          HAS_PAGES=$(git ls-remote --heads "$REMOTE_REPO_URL" refs/heads/gh-pages | wc -l)

          rm -rf existing-pages
          if [ "$HAS_PAGES" -gt 0 ]; then
            echo "Existing gh-pages branch detected on remote. Cloning historical deployment..."
            git clone --depth 1 --branch gh-pages "$REMOTE_REPO_URL" existing-pages
            echo "Successfully retrieved existing gh-pages branch. Historical metadata will be preserved."
          else
            echo "No existing gh-pages branch found on remote. Initializing fresh repository."
            mkdir -p existing-pages
          fi

          # 2. Prepare directory skeleton for metadata publishing (Strict Zero-Binary Guarantee)
          # Preserve existing channel trees from previous deployment (e.g. keep stable when deploying testing)
          rm -rf public-repo
          mkdir -p public-repo
          if [ -d existing-pages/dists ]; then
            cp -r existing-pages/dists public-repo/
          fi
          if [ -d existing-pages/rpm ]; then
            cp -r existing-pages/rpm public-repo/
          fi

          mkdir -p "public-repo/dists/${CHANNEL}/main/binary-amd64"
          mkdir -p "public-repo/dists/${CHANNEL}/main/binary-arm64"

          # Symmetrical channel-first RPM repository layout: rpm/${CHANNEL}/${arch}
          RPM_CHANNEL_DIR="public-repo/rpm/${CHANNEL}"
          RPM_EXISTING_PREFIX="existing-pages/rpm/${CHANNEL}"

          mkdir -p "${RPM_CHANNEL_DIR}/x86_64"
          mkdir -p "${RPM_CHANNEL_DIR}/aarch64"

          GPG_KEY_ID="${GPG_KEY_ID:-$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | tail -n 1)}"

          # Export public keys
          gpg --batch --yes --export "$GPG_KEY_ID" > public-repo/kvrocks.gpg
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > public-repo/kvrocks.asc

          # Copy installer script, landing page, and generate client repo config
          cp scripts/install.sh public-repo/install.sh
          cp web/index.html public-repo/index.html

          # Single Source of Truth for Edge Gateway URL (supports vars.KVROCKS_GATEWAY_URL override)
          GATEWAY_URL="${KVROCKS_GATEWAY_URL:-https://kvrocks.kryo.eu.org}"
          printf '[kvrocks]\nname=Apache Kvrocks Repository\nbaseurl=%s/rpm/stable/$basearch/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=%s/kvrocks.asc\n\n[kvrocks-testing]\nname=Apache Kvrocks Testing Repository\nbaseurl=%s/rpm/testing/$basearch/\nenabled=0\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=%s/kvrocks.asc\n' "$GATEWAY_URL" "$GATEWAY_URL" "$GATEWAY_URL" "$GATEWAY_URL" > public-repo/kvrocks.repo
          touch public-repo/.nojekyll

          # Prime gpg-agent in-memory cache via stdin pipeline if needed (avoids writing passphrase to disk)
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -u "$GPG_KEY_ID" -sbo /dev/null /dev/null
          fi

          # Prepare GPG base arguments (in-memory gpg-agent daemon handles passphrase caching)
          GPG_BASE_ARGS=(--batch --yes --default-key "$GPG_KEY_ID" --pinentry-mode loopback)

          # 3. Stage newly built packages into temporary isolated sandbox (never copied into public-repo)
          mkdir -p staging/deb/pool/main
          mkdir -p staging/rpm/x86_64
          mkdir -p staging/rpm/aarch64

          cp dist/*.deb staging/deb/pool/main/
          cp dist/*.x86_64.rpm staging/rpm/x86_64/
          cp dist/*.aarch64.rpm staging/rpm/aarch64/

          # Verify packages were staged properly in sandbox
          if ! ls staging/deb/pool/main/*.deb >/dev/null 2>&1; then
            echo "::error::No Debian packages found in staging!"
            exit 1
          fi

          # ==========================================
          # 4. Build Debian APT Metadata (Incremental Merge)
          # ==========================================
          ROOT_DIR="$(pwd)"
          for deb_arch in amd64 arm64; do
            (
              cd staging/deb
              dpkg-scanpackages -m --arch "$deb_arch" pool/main > "${ROOT_DIR}/public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages.new"
            )

            old_pkg="${ROOT_DIR}/existing-pages/dists/${CHANNEL}/main/binary-${deb_arch}/Packages"
            [ -f "$old_pkg" ] || old_pkg="none"

            echo "=== Merging Debian APT Packages (${CHANNEL}/${deb_arch}) ==="
            python3 "${ROOT_DIR}/packaging/merge-deb-packages.py" "$old_pkg" \
              "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages.new" \
              "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages"
            rm -f "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages.new"

            # Compress Packages with both gzip and xz
            gzip -9c "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages" > "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages.gz"
            xz -9c "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages" > "public-repo/dists/${CHANNEL}/main/binary-${deb_arch}/Packages.xz"
          done

          (
            cd "public-repo/dists/${CHANNEL}"
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="Apache Kvrocks Packages" \
              -o APT::FTPArchive::Release::Label="Kvrocks" \
              -o APT::FTPArchive::Release::Suite="${CHANNEL}" \
              -o APT::FTPArchive::Release::Codename="${CHANNEL}" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="Apache Kvrocks Debian/Ubuntu APT Repository (${CHANNEL})" \
              release . > Release

            # Debian SecureApt standardizes on SHA512
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA512 --clearsign -o InRelease Release
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA512 -abs -o Release.gpg Release

            # Verify generated signatures immediately
            gpg --verify InRelease
            gpg --verify Release.gpg Release
          )

          # ==========================================
          # 5. Build RPM Metadata (Incremental Merge using mergerepo_c)
          # ==========================================
          for arch in x86_64 aarch64; do
            echo "=== Generating RPM Metadata for ${CHANNEL}/${arch} ==="
            if ! ls "staging/rpm/${arch}/"*.rpm >/dev/null 2>&1; then
              echo "::error::No RPM packages found in staging/rpm/${arch}/!"
              exit 1
            fi

            createrepo_c "staging/rpm/${arch}/"
            rm -rf "${RPM_CHANNEL_DIR}/${arch}/repodata"

            if [ -d "${RPM_EXISTING_PREFIX}/${arch}/repodata" ]; then
              echo "Merging RPM repository metadata for ${CHANNEL}/${arch}..."
              mergerepo_c --all \
                --repo "${RPM_EXISTING_PREFIX}/${arch}/" \
                --repo "staging/rpm/${arch}/" \
                -o "${RPM_CHANNEL_DIR}/${arch}/"
            else
              echo "Initializing new RPM repository metadata for ${CHANNEL}/${arch}..."
              mkdir -p "${RPM_CHANNEL_DIR}/${arch}"
              cp -r "staging/rpm/${arch}/repodata" "${RPM_CHANNEL_DIR}/${arch}/"
            fi

            if [ ! -f "${RPM_CHANNEL_DIR}/${arch}/repodata/repomd.xml" ]; then
              echo "::error::RPM repomd.xml was not generated for ${CHANNEL}/${arch}!"
              exit 1
            fi

            # RPM detached GPG signature
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA256 --detach-sign --armor \
              -o "${RPM_CHANNEL_DIR}/${arch}/repodata/repomd.xml.asc" "${RPM_CHANNEL_DIR}/${arch}/repodata/repomd.xml"
            gpg --verify "${RPM_CHANNEL_DIR}/${arch}/repodata/repomd.xml.asc" "${RPM_CHANNEL_DIR}/${arch}/repodata/repomd.xml"
          done
          rm -rf staging existing-pages

          # ==========================================
          # 6. Quality Gate: Zero-Binary Invariant Audit
          # ==========================================
          # Ensure public-repo contains strictly metadata (<100KB), completely eliminating quota limits.
          # Binary packages are permanently hosted on GitHub Releases and streamed via Cloudflare Edge Gateway.
          LEAKED_PACKAGES=$(find public-repo -type f \( -name "*.deb" -o -name "*.rpm" \))
          if [ -n "$LEAKED_PACKAGES" ]; then
            echo "::error title=Binary Leak Detected::Package binaries unexpectedly found in metadata repository:"
            echo "$LEAKED_PACKAGES"
            exit 1
          fi

          TOTAL_PAGES_KB=$(du -sk public-repo | cut -f1)
          echo "Total metadata repository footprint: ${TOTAL_PAGES_KB} KB"

          echo "### Dual APT & RPM Metadata Repositories Generated (${CHANNEL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Channel**: \`${CHANNEL}\` ($( [ "$IS_PRERELEASE" = "true" ] && echo "Pre-release / Testing" || echo "Stable Production" ))" >> $GITHUB_STEP_SUMMARY
          echo "- **Edge Gateway Endpoint**: \`${GATEWAY_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APT Repository (via Gateway)**: \`${GATEWAY_URL} ${CHANNEL} main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **RPM Repository (via Gateway)**: \`${GATEWAY_URL}/rpm/${CHANNEL}/\$basearch/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **YUM / DNF Repo Config**: \`${GATEWAY_URL}/kvrocks.repo\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GPG Public Key (ASCII)**: \`${GATEWAY_URL}/kvrocks.asc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages Footprint**: \`${TOTAL_PAGES_KB} KB\` (Zero binary bloat, multi-channel retention enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- **Binary Asset Storage**: Hosted on [GitHub Releases](https://github.com/rawvoid/kvrocks-fpm/releases) & stream-cached at Cloudflare Edge." >> $GITHUB_STEP_SUMMARY

      - name: Deploy Repositories to GitHub Pages
        if: inputs.draft != true && inputs.draft != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-repo
          keep_files: false
