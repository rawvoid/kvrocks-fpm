name: Release Packages

concurrency:
  group: pages-repository-deployment
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Apache Kvrocks version to build (e.g. 2.15.0)'
        type: string
        required: true
      iteration:
        description: 'Package iteration/revision number'
        type: string
        required: true
        default: '1'
      draft:
        description: 'Create as Draft Release (do not publish to GitHub Pages)'
        type: boolean
        required: true
        default: false
      publish_release:
        description: 'Publish release to GitHub Releases'
        type: boolean
        required: true
        default: true

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.arch }}, ${{ matrix.cpu_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Modern CPU optimized x86-64-v3 build (AVX, AVX2, BMI1/2, FMA, PCLMUL - Default Performance package)
          - os: ubuntu-22.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: v3
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: "-march=x86-64-v3 -mpclmul -O3"
            pkg_suffix: ""
            deb_extra_args: "--conflicts kvrocks-legacy --replaces kvrocks-legacy"
            rpm_extra_args: "--conflicts kvrocks-legacy"

          # Legacy x86-64-v1 build (Baseline compatibility for older CPUs/VMs without AVX2)
          - os: ubuntu-22.04
            arch: amd64
            rpm_arch: x86_64
            cpu_target: legacy
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: "-O3"
            pkg_suffix: "-legacy"
            deb_extra_args: "--provides kvrocks --conflicts kvrocks --replaces kvrocks"
            rpm_extra_args: "--provides kvrocks --conflicts kvrocks"

          # ARM64 / aarch64 build
          - os: ubuntu-22.04-arm
            arch: arm64
            rpm_arch: aarch64
            cpu_target: generic
            cmake_flags: "-DPORTABLE=1 -DENABLE_OPENSSL=ON -DENABLE_LTO=ON"
            extra_flags: "-O3"
            pkg_suffix: ""
            deb_extra_args: ""
            rpm_extra_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake libtool python3 \
                                  ruby-full ruby-dev rpm libssl-dev ccache binutils
          sudo gem install --no-document fpm

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.cpu_target }}-

      - name: Resolve Version & Iteration
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ITERATION: ${{ inputs.iteration }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          ITERATION="${INPUT_ITERATION}"

          if [ -z "$VERSION" ]; then
            echo "::error::Version must be explicitly provided!"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version must match semantic versioning format (e.g. 2.15.0)!"
            exit 1
          fi

          if ! echo "$ITERATION" | grep -Eq '^[0-9A-Za-z.+~]+$'; then
            echo "::error::Iteration must be a valid package revision token (e.g. 1)!"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ITERATION=$ITERATION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION, iteration: $ITERATION"

      - name: Build Kvrocks
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="1G"
          export LDFLAGS="-static-libstdc++ -static-libgcc $LDFLAGS"
          # Inject -g to generate comprehensive DWARF debug symbols alongside -O3 optimizations
          export CFLAGS="-g ${{ matrix.extra_flags }}"
          export CXXFLAGS="-g ${{ matrix.extra_flags }}"
          ccache -z

          git clone --depth 1 -b v${{ env.VERSION }} https://github.com/apache/kvrocks.git
          cd kvrocks
          ./x.py build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc -flto=auto" ${{ matrix.cmake_flags }} -j $(nproc)
          
          ccache -s

      - name: Inspect Binary Linkage & Compatibility
        run: |
          echo "=== Dynamic library dependencies (ldd) ==="
          ldd kvrocks/build/kvrocks || true
          
          echo "=== Check libstdc++ linkage ==="
          if ldd kvrocks/build/kvrocks | grep -q "libstdc++"; then
            echo "::warning::libstdc++ is dynamically linked!"
          else
            echo "Verified: libstdc++ is statically linked."
          fi

          echo "=== Glibc symbols required by kvrocks ==="
          objdump -T kvrocks/build/kvrocks | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu > "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" || true
          MAX_GLIBC=$(tail -n 1 "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" 2>/dev/null || echo "unknown")
          echo "Max GLIBC symbol required: ${MAX_GLIBC}"
          cat "glibc-symbols-${{ matrix.arch }}-${{ matrix.cpu_target }}.txt" || true
          echo "### Binary Compatibility (${{ matrix.arch }}-${{ matrix.cpu_target }})" >> $GITHUB_STEP_SUMMARY
          echo "- Highest GLIBC symbol required: \`${MAX_GLIBC}\`" >> $GITHUB_STEP_SUMMARY

      - name: Separate Debug Symbols & Strip Binaries
        run: |
          DEBUGINFO_NAME="kvrocks${{ matrix.pkg_suffix }}-debuginfo_${{ env.VERSION }}-${{ env.ITERATION }}_${{ matrix.arch }}.tar.gz"
          echo "DEBUGINFO_NAME=${DEBUGINFO_NAME}" >> $GITHUB_ENV

          echo "=== Extracting detached debug symbols ==="
          objcopy --only-keep-debug kvrocks/build/kvrocks kvrocks/build/kvrocks.debug
          objcopy --only-keep-debug kvrocks/build/kvrocks2redis kvrocks/build/kvrocks2redis.debug
          chmod 0644 kvrocks/build/kvrocks.debug kvrocks/build/kvrocks2redis.debug

          echo "=== Stripping production binaries ==="
          strip --strip-unneeded kvrocks/build/kvrocks
          strip --strip-unneeded kvrocks/build/kvrocks2redis

          echo "=== Embedding debuglink into binaries ==="
          objcopy --add-gnu-debuglink=kvrocks/build/kvrocks.debug kvrocks/build/kvrocks
          objcopy --add-gnu-debuglink=kvrocks/build/kvrocks2redis.debug kvrocks/build/kvrocks2redis

          echo "=== Quality Gate: Verifying Debug Symbols & Build IDs ==="
          # 1. Verify DWARF debug sections exist
          if ! readelf -S kvrocks/build/kvrocks.debug 2>/dev/null | grep -q '\.debug_info'; then
            echo "::error::kvrocks.debug does not contain .debug_info! DWARF symbol generation failed."
            exit 1
          fi
          echo "Verified: kvrocks.debug contains valid DWARF debug sections."

          # 2. Verify binary and detached debuginfo share the exact same GNU Build ID
          KV_BIN_ID=$(readelf -n kvrocks/build/kvrocks | awk '/Build ID:/{print $3}')
          KV_DBG_ID=$(readelf -n kvrocks/build/kvrocks.debug 2>/dev/null | awk '/Build ID:/{print $3}')
          echo "Kvrocks GNU Build ID: ${KV_BIN_ID}"
          if [ -z "$KV_BIN_ID" ] || [ "$KV_BIN_ID" != "$KV_DBG_ID" ]; then
            echo "::error::Build ID mismatch! Binary (${KV_BIN_ID}) != Debug (${KV_DBG_ID})"
            exit 1
          fi
          echo "Verified: GNU Build IDs match perfectly."

          echo "=== Archiving debug symbols ==="
          tar -czf "${DEBUGINFO_NAME}" -C kvrocks/build kvrocks.debug kvrocks2redis.debug
          ls -lh "${DEBUGINFO_NAME}" kvrocks/build/kvrocks kvrocks/build/kvrocks2redis

          echo "### Binary Stripping & Detached Debuginfo (${{ matrix.arch }}-${{ matrix.cpu_target }})" >> $GITHUB_STEP_SUMMARY
          echo "- GNU Build ID: \`${KV_BIN_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Stripped binary size: \`$(du -h kvrocks/build/kvrocks | cut -f1)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Detached debug archive: \`${DEBUGINFO_NAME}\` (\`$(du -h ${DEBUGINFO_NAME} | cut -f1)\`)" >> $GITHUB_STEP_SUMMARY

      - name: Prepare Packaging RootFS
        run: |
          mkdir -p rootfs/usr/bin
          mkdir -p rootfs/etc/kvrocks
          mkdir -p rootfs/usr/share/doc/kvrocks
          mkdir -p rootfs/usr/lib/systemd/system

          # Binaries
          cp kvrocks/build/kvrocks rootfs/usr/bin/
          cp kvrocks/build/kvrocks2redis rootfs/usr/bin/

          # Configuration with FHS paths and native log retention
          cp kvrocks/kvrocks.conf rootfs/etc/kvrocks/kvrocks.conf
          python3 packaging/patch-config.py rootfs/etc/kvrocks/kvrocks.conf

          # License, Notice & Pristine Upstream Configuration References
          cp -r kvrocks/LICENSE kvrocks/NOTICE kvrocks/licenses rootfs/usr/share/doc/kvrocks/
          cp kvrocks/kvrocks.conf rootfs/usr/share/doc/kvrocks/kvrocks.conf.default
          if [ -f kvrocks/utils/kvrocks2redis/kvrocks2redis.conf ]; then
            cp kvrocks/utils/kvrocks2redis/kvrocks2redis.conf rootfs/usr/share/doc/kvrocks/kvrocks2redis.conf.default
          elif [ -f kvrocks/kvrocks2redis.conf ]; then
            cp kvrocks/kvrocks2redis.conf rootfs/usr/share/doc/kvrocks/kvrocks2redis.conf.default
          fi

          # Systemd service unit (unified standard path /usr/lib/systemd/system)
          cp systemd/kvrocks.service rootfs/usr/lib/systemd/system/

          # Display colored unified diff in a collapsible group
          echo "::group::View Configuration Diff (Upstream vs Patched)"
          diff -u --color=always rootfs/usr/share/doc/kvrocks/kvrocks.conf.default rootfs/etc/kvrocks/kvrocks.conf || true
          echo "::endgroup::"

      - name: Validate Patched Configuration (Dry-Run)
        run: |
          mkdir -p /tmp/kvrocks-dryrun/data /tmp/kvrocks-dryrun/log
          kvrocks/build/kvrocks -c rootfs/etc/kvrocks/kvrocks.conf \
            --bind 127.0.0.1 \
            --port 56789 \
            --dir /tmp/kvrocks-dryrun/data \
            --log-dir /tmp/kvrocks-dryrun/log \
            --daemonize no &
          KV_PID=$!
          sleep 1
          if kill -0 $KV_PID 2>/dev/null; then
            echo "Kvrocks configuration successfully validated against built binary."
            kill -TERM $KV_PID
            wait $KV_PID 2>/dev/null || true
            rm -rf /tmp/kvrocks-dryrun
          else
            wait $KV_PID
            EXIT_CODE=$?
            echo "::error::Kvrocks failed to parse patched configuration! Exit code: $EXIT_CODE"
            rm -rf /tmp/kvrocks-dryrun
            exit 1
          fi

      - name: Package DEB
        run: |
          fpm -s dir -t deb \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.arch }}" \
            -d "libssl3" \
            --category "database" \
            --vendor "Rawvoid" \
            --maintainer "Rawvoid <rawvoid@users.noreply.github.com>" \
            --deb-user root \
            --deb-group root \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --before-remove packaging/hooks/prerm.sh \
            --after-install packaging/hooks/postinst.sh \
            --after-remove packaging/hooks/postrm.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.deb_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}_${{ env.VERSION }}-${{ env.ITERATION }}_${{ matrix.arch }}.deb"

      - name: Package RPM
        run: |
          fpm -s dir -t rpm \
            -n "kvrocks${{ matrix.pkg_suffix }}" \
            -v "${{ env.VERSION }}" \
            --iteration "${{ env.ITERATION }}" \
            -a "${{ matrix.rpm_arch }}" \
            -d "libssl.so.3()(64bit)" \
            --rpm-digest sha256 \
            --category "database" \
            --vendor "Rawvoid" \
            --maintainer "Rawvoid <rawvoid@users.noreply.github.com>" \
            --rpm-user root \
            --rpm-group root \
            -C rootfs \
            --config-files /etc/kvrocks/kvrocks.conf \
            --before-remove packaging/hooks/prerm.sh \
            --after-install packaging/hooks/postinst.sh \
            --after-remove packaging/hooks/postrm.sh \
            --rpm-posttrans packaging/hooks/rpm-posttrans.sh \
            --description 'A distributed key value NoSQL database that uses RocksDB as storage engine and is compatible with Redis protocol' \
            --url 'https://kvrocks.apache.org' \
            --license 'Apache-2.0' \
            ${{ matrix.rpm_extra_args }} \
            -p "kvrocks${{ matrix.pkg_suffix }}-${{ env.VERSION }}-${{ env.ITERATION }}.${{ matrix.rpm_arch }}.rpm"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.cpu_target }}
          path: |
            *.deb
            *.rpm
            *.tar.gz
            glibc-symbols-*.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Repositories
    needs: build-and-package
    if: inputs.publish_release == true || inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve Release Tag & Name
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ITERATION: ${{ inputs.iteration }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          ITERATION="${INPUT_ITERATION}"

          if [ -z "$VERSION" ]; then
            echo "::error::Version must be explicitly provided!"
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Version must match semantic versioning format (e.g. 2.15.0)!"
            exit 1
          fi

          if ! echo "$ITERATION" | grep -Eq '^[0-9A-Za-z.+~]+$'; then
            echo "::error::Iteration must be a valid package revision token (e.g. 1)!"
            exit 1
          fi

          echo "RELEASE_TAG=v${VERSION}-${ITERATION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Kvrocks ${VERSION}-${ITERATION}" >> $GITHUB_ENV

      - name: Setup GPG & Sign RPM Packages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set! Repository and package signing cannot proceed."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y rpm gnupg

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye 2>/dev/null || true

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | tail -n 1)
          echo "Loaded GPG signing key: $GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV

          # Configure RPM macros for package signing
          printf '%%_signature gpg\n%%_gpg_name %s\n%%_gpg_path ~/.gnupg\n%%_gpg_digest_algo sha256\n' "$GPG_KEY_ID" > ~/.rpmmacros
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" > /tmp/gpg_passphrase
            chmod 600 /tmp/gpg_passphrase
            trap 'rm -f /tmp/gpg_passphrase /tmp/kvrocks-signing-key.asc' EXIT
            printf '%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase-file /tmp/gpg_passphrase %%{?_gpg_digest_algo:--digest-algo %%{_gpg_digest_algo}} --no-secmem-warning -u "%%{_gpg_name}" -sbo %%{__signature_filename} %%{__plaintext_filename}\n' >> ~/.rpmmacros
          else
            trap 'rm -f /tmp/kvrocks-signing-key.asc' EXIT
            printf '%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback %%{?_gpg_digest_algo:--digest-algo %%{_gpg_digest_algo}} --no-secmem-warning -u "%%{_gpg_name}" -sbo %%{__signature_filename} %%{__plaintext_filename}\n' >> ~/.rpmmacros
          fi

          echo "Signing RPM packages in dist/..."
          rpmsign --addsign dist/*.rpm

          # Export public key to a regular file (avoids sudo closing process substitution /dev/fd/N)
          gpg --armor --export "$GPG_KEY_ID" > /tmp/kvrocks-signing-key.asc
          sudo rpm --import /tmp/kvrocks-signing-key.asc

          echo "Verifying RPM package signatures..."
          for rpm_pkg in dist/*.rpm; do
            verify_out=$(rpm -K --define '_pkgverify_level all' "$rpm_pkg")
            echo "$verify_out"
            if ! echo "$verify_out" | grep -q 'signatures OK'; then
              echo "::error::RPM package $rpm_pkg is not properly signed!"
              exit 1
            fi
          done

      - name: Generate Checksums & Consolidate Glibc Symbols
        run: |
          cd dist
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cat glibc-symbols-*.txt 2>/dev/null | sort -Vu > glibc-symbols.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ inputs.draft == true || inputs.draft == 'true' }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Draft Release Status
        if: inputs.draft == true || inputs.draft == 'true'
        run: |
          echo "### Draft Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Draft release \`${{ env.RELEASE_TAG }}\` created on GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "- **Note**: Deployment to GitHub Pages skipped. Draft releases are not published to online APT/RPM repositories." >> $GITHUB_STEP_SUMMARY

      - name: Build Debian APT & RPM Repositories (Incremental Merge)
        if: inputs.draft != true && inputs.draft != 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KVROCKS_GATEWAY_URL: ${{ vars.KVROCKS_GATEWAY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm xz-utils

          # 1. Safely retrieve existing gh-pages deployment to preserve historical metadata
          # Check if gh-pages branch genuinely exists on remote before cloning.
          # If it exists on remote, git clone MUST succeed. If clone fails, abort immediately to protect historical records!
          REMOTE_REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          HAS_PAGES=$(git ls-remote --heads "$REMOTE_REPO_URL" refs/heads/gh-pages | wc -l)

          rm -rf existing-pages
          if [ "$HAS_PAGES" -gt 0 ]; then
            echo "Existing gh-pages branch detected on remote. Cloning historical deployment..."
            git clone --depth 1 --branch gh-pages "$REMOTE_REPO_URL" existing-pages
            echo "Successfully retrieved existing gh-pages branch. Historical metadata will be preserved."
          else
            echo "No existing gh-pages branch found on remote. Initializing fresh repository."
            mkdir -p existing-pages
          fi

          # 2. Prepare directory skeleton
          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64
          mkdir -p apt-repo/rpm/x86_64
          mkdir -p apt-repo/rpm/aarch64

          GPG_KEY_ID="${GPG_KEY_ID:-$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | tail -n 1)}"

          # Export public keys
          gpg --batch --yes --export "$GPG_KEY_ID" > apt-repo/kvrocks.gpg
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > apt-repo/kvrocks.asc
          sudo rpm --import apt-repo/kvrocks.asc

          # Copy installer script and generate client repo config
          cp scripts/install.sh apt-repo/install.sh

          GATEWAY_URL="${KVROCKS_GATEWAY_URL:-https://kvrocks.kryo.eu.org}"
          printf '[kvrocks]\nname=Apache Kvrocks Repository\nbaseurl=%s/rpm/$basearch/\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=%s/kvrocks.asc\n' "$GATEWAY_URL" "$GATEWAY_URL" > apt-repo/kvrocks.repo
          touch apt-repo/.nojekyll

          # Prepare GPG base arguments with secure passphrase file handling
          GPG_BASE_ARGS=(--batch --yes --default-key "$GPG_KEY_ID")
          if [ -n "$GPG_PASSPHRASE" ]; then
            echo "$GPG_PASSPHRASE" > /tmp/gpg_passphrase
            chmod 600 /tmp/gpg_passphrase
            trap 'rm -f /tmp/gpg_passphrase' EXIT
            GPG_BASE_ARGS+=(--pinentry-mode loopback --passphrase-file /tmp/gpg_passphrase)
          fi

          # Stage newly built packages from dist/
          cp dist/*.deb apt-repo/pool/main/
          cp dist/*.x86_64.rpm apt-repo/rpm/x86_64/
          cp dist/*.aarch64.rpm apt-repo/rpm/aarch64/

          # Verify packages were staged properly
          if ! ls apt-repo/pool/main/*.deb >/dev/null 2>&1; then
            echo "::error::No Debian packages found in apt-repo/pool/main/!"
            exit 1
          fi

          # ==========================================
          # 3. Build Debian APT Metadata (Incremental Merge)
          # ==========================================
          ROOT_DIR="$(pwd)"
          (
            cd apt-repo
            dpkg-scanpackages -m --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages.new
            dpkg-scanpackages -m --arch arm64 pool/main > dists/stable/main/binary-arm64/Packages.new

            OLD_AMD64="${ROOT_DIR}/existing-pages/dists/stable/main/binary-amd64/Packages"
            OLD_ARM64="${ROOT_DIR}/existing-pages/dists/stable/main/binary-arm64/Packages"

            [ -f "$OLD_AMD64" ] || OLD_AMD64="none"
            [ -f "$OLD_ARM64" ] || OLD_ARM64="none"

            echo "=== Merging Debian APT Packages (amd64) ==="
            python3 "${ROOT_DIR}/packaging/merge-deb-packages.py" "$OLD_AMD64" dists/stable/main/binary-amd64/Packages.new dists/stable/main/binary-amd64/Packages
            echo "=== Merging Debian APT Packages (arm64) ==="
            python3 "${ROOT_DIR}/packaging/merge-deb-packages.py" "$OLD_ARM64" dists/stable/main/binary-arm64/Packages.new dists/stable/main/binary-arm64/Packages
            rm -f dists/stable/main/binary-amd64/Packages.new dists/stable/main/binary-arm64/Packages.new

            # Compress Packages with both gzip and xz
            gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
            xz -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.xz

            gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz
            xz -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.xz

            cd dists/stable
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="Apache Kvrocks Packages" \
              -o APT::FTPArchive::Release::Label="Kvrocks" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="Apache Kvrocks Debian/Ubuntu APT Repository" \
              release . > Release

            # Debian SecureApt standardizes on SHA512
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA512 --clearsign -o InRelease Release
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA512 -abs -o Release.gpg Release

            # Verify generated signatures immediately
            gpg --verify InRelease
            gpg --verify Release.gpg Release
          )

          # ==========================================
          # 4. Build RPM Metadata (Incremental Merge using mergerepo_c)
          # ==========================================
          for arch in x86_64 aarch64; do
            echo "=== Generating RPM Metadata for ${arch} ==="
            if ! ls "apt-repo/rpm/${arch}/"*.rpm >/dev/null 2>&1; then
              echo "::error::No RPM packages found in apt-repo/rpm/${arch}/!"
              exit 1
            fi

            mkdir -p "new-repo/rpm/${arch}"
            cp "apt-repo/rpm/${arch}/"*.rpm "new-repo/rpm/${arch}/"
            createrepo_c "new-repo/rpm/${arch}/"

            if [ -d "existing-pages/rpm/${arch}/repodata" ]; then
              echo "Merging RPM repository metadata for ${arch}..."
              mkdir -p "apt-repo/rpm/${arch}"
              mergerepo_c --all \
                --repo "existing-pages/rpm/${arch}/" \
                --repo "new-repo/rpm/${arch}/" \
                -o "apt-repo/rpm/${arch}/"
            else
              echo "Initializing new RPM repository metadata for ${arch}..."
              mkdir -p "apt-repo/rpm/${arch}"
              cp -r "new-repo/rpm/${arch}/repodata" "apt-repo/rpm/${arch}/"
            fi

            if [ ! -f "apt-repo/rpm/${arch}/repodata/repomd.xml" ]; then
              echo "::error::RPM repomd.xml was not generated for ${arch}!"
              exit 1
            fi

            # RPM detached GPG signature
            gpg "${GPG_BASE_ARGS[@]}" --digest-algo SHA256 --detach-sign --armor \
              -o "apt-repo/rpm/${arch}/repodata/repomd.xml.asc" "apt-repo/rpm/${arch}/repodata/repomd.xml"
            gpg --verify "apt-repo/rpm/${arch}/repodata/repomd.xml.asc" "apt-repo/rpm/${arch}/repodata/repomd.xml"
          done
          rm -rf new-repo existing-pages

          # ==========================================
          # 5. Purge Binary Packages from apt-repo (Zero-Binary Hosting)
          # ==========================================
          # Binary packages are permanently hosted on GitHub Releases and streamed via Cloudflare Edge Gateway.
          # GitHub Pages hosts ONLY lightweight repository metadata (<100KB), completely eliminating quota limits.
          echo "=== Purging binary packages to keep GitHub Pages featherweight (<100KB) ==="
          rm -rf apt-repo/pool
          rm -f apt-repo/rpm/x86_64/*.rpm
          rm -f apt-repo/rpm/aarch64/*.rpm

          TOTAL_PAGES_KB=$(du -sk apt-repo | cut -f1)
          echo "Total metadata repository footprint: ${TOTAL_PAGES_KB} KB"
          if [ "$TOTAL_PAGES_KB" -gt 5000 ]; then
            echo "::error::Metadata repository size exceeds 5MB! Check for leaked binary files."
            exit 1
          fi

          echo "### Dual APT & RPM Metadata Repositories Generated" >> $GITHUB_STEP_SUMMARY
          echo "- **Edge Gateway Endpoint**: \`${GATEWAY_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APT Repository (via Gateway)**: \`${GATEWAY_URL} stable main\`" >> $GITHUB_STEP_SUMMARY
          echo "- **RPM Repository (via Gateway)**: \`${GATEWAY_URL}/rpm/\$basearch/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **YUM / DNF Repo Config**: \`${GATEWAY_URL}/kvrocks.repo\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GPG Public Key (ASCII)**: \`${GATEWAY_URL}/kvrocks.asc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Pages Footprint**: \`${TOTAL_PAGES_KB} KB\` (Zero binary bloat, multi-version retention enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- **Binary Asset Storage**: Hosted on [GitHub Releases](https://github.com/rawvoid/kvrocks-fpm/releases) & stream-cached at Cloudflare Edge." >> $GITHUB_STEP_SUMMARY

      - name: Deploy Repositories to GitHub Pages
        if: inputs.draft != true && inputs.draft != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          keep_files: false
