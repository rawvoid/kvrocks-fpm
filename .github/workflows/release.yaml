name: Release Packages

# Manual entry point for the shared release pipeline. Inputs and behavior are
# unchanged; automated upstream tracking lives in auto-release.yaml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Apache Kvrocks version to build (e.g. 2.15.0 or 2.15.0-rc1)'
        type: string
        required: true
      iteration:
        description: 'Package iteration/revision number'
        type: string
        required: true
        default: '1'
      dry_run:
        description: 'Dry run: build packages and merge repository indexes locally, publish nothing'
        type: boolean
        default: false

jobs:
  release:
    name: Release Packages
    # Draft releases are only visible to tokens with write access.
    permissions:
      contents: write
    uses: ./.github/workflows/release-pipeline.yaml
    with:
      version: ${{ inputs.version }}
      iteration: ${{ inputs.iteration }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
