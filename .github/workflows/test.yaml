name: Test & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # python-debian re-parses the merged Packages index with the reference deb822 parser, so the
      # conformance assertion runs instead of being skipped.
      - name: Install Python Test Dependencies
        run: |
          pip install python-debian

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover -s packaging -p "test_*.py" -v

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Gateway Unit Tests
        run: |
          npm --prefix gateway test

      - name: Validate Web Landing Page
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('gateway/public/index.html', 'utf8');
            const scripts = html.match(/<script[\s\S]*?<\/script>/gi) || [];
            for (const s of scripts) {
              if (!s.includes('src=')) {
                const code = s.replace(/<script[\s\S]*?>/i, '').replace(/<\/script>/i, '');
                new Function(code);
              }
            }
            console.log('gateway/public/index.html inline scripts validated successfully.');
          "

      # The deploy uploads the rendered copy, so an unrendered `__GITHUB_REPO__` (or `__REPO_ORIGIN__`
      # in index.html) would ship a broken page, whereas install.sh and kvrocks.repo keep `__REPO_ORIGIN__`
      # for the Worker to fill in per request.
      - name: Render Static Assets
        run: |
          npm --prefix gateway run build
          if grep -rn "__GITHUB_REPO__" gateway/dist; then
            echo "::error title=Unrendered Placeholder::__GITHUB_REPO__ survived rendering in the assets above."
            exit 1
          fi
          if grep -n "__REPO_ORIGIN__" gateway/dist/index.html; then
            echo "::error title=Unrendered Placeholder::__REPO_ORIGIN__ appeared in index.html."
            exit 1
          fi
          for tpl in install.sh kvrocks.repo; do
            if ! grep -q "__REPO_ORIGIN__" "gateway/dist/$tpl"; then
              echo "::error title=Missing Template Placeholder::gateway/dist/${tpl} is missing __REPO_ORIGIN__."
              exit 1
            fi
          done
          # A root-relative reference points at a file this deploy must ship; a typo would 404 silently.
          grep -o -E '(href|src)="/[^"]*"' gateway/dist/index.html \
            | sed -E 's/^[a-z]+="\///; s/"$//' | sort -u > "$RUNNER_TEMP/root-refs.txt"
          while IFS= read -r ref; do
            if [ ! -f "gateway/dist/$ref" ]; then
              echo "::error title=Missing Asset::index.html references /$ref, which is not part of dist/."
              exit 1
            fi
          done < "$RUNNER_TEMP/root-refs.txt"

      - name: Run Shellcheck
        run: |
          shellcheck gateway/public/*.sh packaging/hooks/*.sh
