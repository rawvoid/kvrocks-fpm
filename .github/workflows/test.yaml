name: Test & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover -s packaging -p "test_*.py" -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gateway Unit Tests
        run: |
          npm --prefix gateway test

      - name: Run Shellcheck
        run: |
          shellcheck scripts/install.sh packaging/hooks/*.sh

      - name: Validate Shell Script Syntax
        run: |
          bash -n scripts/install.sh packaging/hooks/*.sh
