name: Test & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # python-debian re-parses the merged Packages index with the reference deb822 parser, so the
      # conformance assertion runs instead of being skipped.
      - name: Install Python Test Dependencies
        run: |
          pip install python-debian

      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover -s packaging -p "test_*.py" -v

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Gateway Unit Tests
        run: |
          npm --prefix gateway test

      - name: Validate Web Landing Page
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('gateway/public/index.html', 'utf8');
            const scripts = html.match(/<script[\s\S]*?<\/script>/gi) || [];
            for (const s of scripts) {
              if (!s.includes('src=')) {
                const code = s.replace(/<script[\s\S]*?>/i, '').replace(/<\/script>/i, '');
                new Function(code);
              }
            }
            console.log('gateway/public/index.html inline scripts validated successfully.');
          "

      # The deploy uploads the rendered copy, so a placeholder left behind would ship a broken page or an
      # installer that refuses to run. A dummy origin exercises the origin substitution too.
      - name: Render Static Assets
        env:
          KVROCKS_GATEWAY_URL: https://repo.example.com
        run: |
          npm --prefix gateway run build
          for placeholder in __GITHUB_REPO__ __REPO_ORIGIN__; do
            if grep -rn "$placeholder" gateway/dist; then
              echo "::error title=Unrendered Placeholder::${placeholder} survived rendering in the assets above."
              exit 1
            fi
          done

      - name: Run Shellcheck
        run: |
          shellcheck gateway/public/*.sh packaging/hooks/*.sh
