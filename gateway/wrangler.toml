name = "kvrocks-repo-gateway"
main = "src/index.js"
compatibility_date = "2026-11-20"
# Preserve optional dashboard-configured plaintext vars (METADATA_ORIGIN, UPSTREAM_REPO, RELEASE_REF,
# MIN_VERSION, MAX_ATTEMPTS) across deploys that pass `--var GITHUB_REPO:...`.
keep_vars = true

# No `[vars]` here on purpose: nothing in this repository names the account or host it is deployed
# under. GITHUB_REPO reaches the Worker from `scripts/render.mjs` (local dev, via `.dev.vars`) and from
# `wrangler deploy --var GITHUB_REPO:...` in CI (via `${{ github.repository }}`).

[assets]
# Pure static assets (/, /styles.css, /favicon.svg), rendered from `public/` by `npm run build`, are
# served straight from the edge without running Worker code. `/install.sh` and `/kvrocks.repo` enter
# `src/index.js` first so `__REPO_ORIGIN__` is filled in from the request origin.
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/install.sh", "/kvrocks.repo"]

[triggers]
# Hourly check for new upstream Apache Kvrocks tags (GA and pre-release) to dispatch release.yaml.
crons = ["0 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true
