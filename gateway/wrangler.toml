name = "kvrocks-repo-gateway"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# No `[vars]` here on purpose: nothing in this repository names the account or host it is deployed
# under. GITHUB_REPO reaches the Worker from `scripts/render.mjs` (local dev, via `.dev.vars`) and from
# `wrangler deploy --var GITHUB_REPO:...` in CI (via `${{ github.repository }}`).

[assets]
# Pure static assets, rendered from `public/` by `npm run build`: no Worker code runs for them, they are
# served straight from the edge. Static assets come before the Worker script, so a request only reaches
# `src/index.js` when no asset matches — i.e. for packages and repository metadata.
directory = "./dist"
